# Enterprise fleet: the 9 OSS SandboxAgents re-expressed for kagent-enterprise
# 1.0.0-alpha3. Enterprise has no SandboxAgent kind; an agent is an AgentTemplate
# admitted by a Harness. All 9 run on the Claude Code harness (the validated
# runtime in this release) against claude-haiku-4-5, same model as the OSS rig.
#
# Two worker pools, for isolation: the incident agents (label
# scope.demo/pool=oncall) run on kagent-oncall through Harness claude-oncall;
# everything else runs on kagent-default through Harness claude. The two
# selectors are disjoint, so each agent has exactly one Harness.
#
# Instructions are composed from prompt libraries (deploy/prompts.yaml plus
# the chart's kagent-builtin-prompts) with {{include "alias/key"}}.
#
# Needs: deploy/prompts.yaml applied first, and Secret kagent-anthropic (key ANTHROPIC_API_KEY) in ns kagent.
apiVersion: kagent.dev/v1alpha3
kind: ModelConfig
metadata:
  name: claude-model-config
  namespace: kagent
spec:
  provider: Anthropic
  model: claude-haiku-4-5
  apiKeySecret: kagent-anthropic
  apiKeySecretKey: ANTHROPIC_API_KEY
---
apiVersion: kagent.dev/v1alpha3
kind: Harness
metadata:
  name: claude
  namespace: kagent
  annotations:
    scope.demo/image-tag: claude-harness:1.0.0-alpha2
spec:
  claude: {}
  env:
  - name: OTEL_RESOURCE_ATTRIBUTES
    value: kagent.harness.kind=claude
  workload:
    image: ghcr.io/kagent-dev/kagent/claude-harness@sha256:6794f2d25be053766030dcd15aa0da58747a425bcf423e851ad0b6870d79d1b5
  substrate:
    workerPoolRef:
      name: kagent-default
    snapshotPolicy:
      location: gs://ate-snapshots/kagent/
  allowedAgentTemplates:
    selector:
      matchLabels:
        kagent.dev/runtime: claude
        scope.demo/pool: general
---
apiVersion: ate.dev/v1alpha1
kind: WorkerPool
metadata:
  name: kagent-oncall
  namespace: kagent
  labels:
    kagent.dev/worker-pool: kagent-oncall
spec:
  replicas: 2
  sandboxClass: gvisor
  workerImage: ghcr.io/kagent-dev/substrate/ateom-gvisor:v0.2.0-beta5
---
apiVersion: kagent.dev/v1alpha3
kind: Harness
metadata:
  name: claude-oncall
  namespace: kagent
  annotations:
    scope.demo/image-tag: claude-harness:1.0.0-alpha2
spec:
  allowedAgentTemplates:
    selector:
      matchLabels:
        kagent.dev/runtime: claude
        scope.demo/pool: oncall
  claude: {}
  env:
  - name: OTEL_RESOURCE_ATTRIBUTES
    value: kagent.harness.kind=claude
  substrate:
    snapshotPolicy:
      location: gs://ate-snapshots/kagent/
    workerPoolRef:
      name: kagent-oncall
  workload:
    image: ghcr.io/kagent-dev/kagent/claude-harness@sha256:6794f2d25be053766030dcd15aa0da58747a425bcf423e851ad0b6870d79d1b5
---
apiVersion: kagent.dev/v1alpha3
kind: AgentTemplate
metadata:
  name: hello-substrate
  namespace: kagent
  labels:
    kagent.dev/runtime: claude
    demo: substrate-scope
    scope.demo/pool: general
spec:
  modelConfig:
    name: claude-model-config
  description: A friendly greeter running as a substrate actor
  systemPrompt: |
    You are a friendly greeter. When asked who you are, say you are hello-substrate, a Claude Code agent inside a gVisor actor.

    {{include "style/voice"}}

    {{include "style/brevity"}}

    {{include "style/identity"}}

    {{include "kagent-builtin-prompts/safety-guardrails"}}
  promptTemplate:
    dataSources:
    - name: house-style
      alias: style
    - name: sre-playbooks
      alias: sre
    - name: kagent-builtin-prompts
---
