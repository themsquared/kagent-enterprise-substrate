# Enterprise fleet for kagent-enterprise 1.0.0-alpha4: 18 agents on 4 workers.
# The first 9 are the OSS SandboxAgents re-expressed (enterprise has no
# SandboxAgent kind; an agent is an AgentTemplate admitted by a Harness); the 9
# from quota-keeper on double the fleet so the density shows. All 18 run on the
# Claude Code harness (the validated runtime in this release) against
# claude-haiku-4-5, same model as the OSS rig.
#
# Two worker pools, for isolation: the incident agents (label
# scope.demo/pool=oncall) run on kagent-oncall through Harness claude-oncall;
# everything else runs on kagent-default through Harness claude. The two
# selectors are disjoint, so each agent has exactly one Harness.
#
# Instructions are composed from prompt libraries (deploy/prompts.yaml plus
# the chart's kagent-builtin-prompts) with {{include "alias/key"}}.
#
# Tools: the useless MCP servers in deploy/mcp.yaml, bound under spec.tools.
#
# Needs: deploy/prompts.yaml and deploy/mcp.yaml applied first, and Secret kagent-anthropic (key ANTHROPIC_API_KEY) in ns kagent.
apiVersion: kagent.dev/v1alpha3
kind: ModelConfig
metadata:
  name: claude-model-config
  namespace: kagent
spec:
  provider: Anthropic
  model: claude-haiku-4-5
  apiKeySecret: kagent-anthropic
  apiKeySecretKey: ANTHROPIC_API_KEY
---
apiVersion: kagent.dev/v1alpha3
kind: Harness
metadata:
  name: claude
  namespace: kagent
  annotations:
    scope.demo/image-tag: claude-harness:1.0.0-alpha3
spec:
  claude: {}
  env:
  - name: OTEL_RESOURCE_ATTRIBUTES
    value: kagent.harness.kind=claude
  workload:
    image: ghcr.io/kagent-dev/kagent/claude-harness@sha256:eaa786736cdb82f3bc6f8928afc6057218c2bb70c5c93eb231c64715d251ac22
  substrate:
    workerPoolRef:
      name: kagent-default
    snapshotPolicy:
      location: gs://ate-snapshots/kagent/
  allowedAgentTemplates:
    selector:
      matchLabels:
        kagent.dev/runtime: claude
        scope.demo/pool: general
---
apiVersion: ate.dev/v1alpha1
kind: WorkerPool
metadata:
  name: kagent-oncall
  namespace: kagent
  labels:
    kagent.dev/worker-pool: kagent-oncall
spec:
  replicas: 2
  sandboxClass: gvisor
  workerImage: us-docker.pkg.dev/solo-public/substrate-enterprise/ateom-gvisor:v0.2.0-beta5-4dc39f7
---
apiVersion: kagent.dev/v1alpha3
kind: Harness
metadata:
  name: claude-oncall
  namespace: kagent
  annotations:
    scope.demo/image-tag: claude-harness:1.0.0-alpha3
spec:
  allowedAgentTemplates:
    selector:
      matchLabels:
        kagent.dev/runtime: claude
        scope.demo/pool: oncall
  claude: {}
  env:
  - name: OTEL_RESOURCE_ATTRIBUTES
    value: kagent.harness.kind=claude
  substrate:
    snapshotPolicy:
      location: gs://ate-snapshots/kagent/
    workerPoolRef:
      name: kagent-oncall
  workload:
    image: ghcr.io/kagent-dev/kagent/claude-harness@sha256:eaa786736cdb82f3bc6f8928afc6057218c2bb70c5c93eb231c64715d251ac22
---
apiVersion: kagent.dev/v1alpha3
kind: AgentTemplate
metadata:
  name: hello-substrate
  namespace: kagent
  labels:
    kagent.dev/runtime: claude
    demo: substrate-scope
    scope.demo/pool: general
spec:
  modelConfig:
    name: claude-model-config
  description: 'A friendly greeter. MCP tools: 🔮 oracle, ☕ coffee'
  systemPrompt: |
    You are a friendly greeter. When asked who you are, say you are hello-substrate, a Claude Code agent inside a gVisor actor.

    {{include "style/voice"}}

    {{include "style/brevity"}}

    {{include "style/identity"}}

    {{include "style/tools"}}

    {{include "kagent-builtin-prompts/safety-guardrails"}}
  promptTemplate:
    dataSources:
    - name: house-style
      alias: style
    - name: sre-playbooks
      alias: sre
    - name: kagent-builtin-prompts
  tools:
  - mcp:
      server:
        kind: RemoteMCPServer
        name: oracle
  - mcp:
      server:
        kind: RemoteMCPServer
        name: coffee
---
