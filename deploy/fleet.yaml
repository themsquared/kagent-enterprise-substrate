    {{include "style/identity"}}

    {{include "style/tools"}}

    {{include "sre/severity-rubric"}}

    {{include "sre/change-safety"}}

    {{include "channel/telegram"}}

    {{include "kagent-builtin-prompts/safety-guardrails"}}
  promptTemplate:
    dataSources:
    - name: house-style
      alias: style
    - name: sre-playbooks
      alias: sre
    - name: telegram-channel
      alias: channel
    - name: kagent-builtin-prompts
  tools:
  - mcp:
      server:
        kind: RemoteMCPServer
        name: excuses
  - mcp:
      server:
        kind: RemoteMCPServer
        name: coffee
  # its own Telegram bot: the token is bound on the RemoteMCPServer
  # (headersFrom) and added by egress per call, never in the sandbox
  - mcp:
      server:
        kind: RemoteMCPServer
        name: telegram
